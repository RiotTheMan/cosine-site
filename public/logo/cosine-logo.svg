<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 100" width="400" height="100">
  <!-- Visual mark: golden spiral in nested φ-rectangles -->
  <g transform="translate(25, 19)">
    <g stroke="#2C5970" stroke-width="0.5" fill="none" opacity="0.45">
      <rect x="0" y="0" width="100" height="62"/>
      <line x1="62" y1="0" x2="62" y2="62"/>
      <line x1="62" y1="38" x2="100" y2="38"/>
      <line x1="76" y1="38" x2="76" y2="62"/>
      <line x1="62" y1="53" x2="76" y2="53"/>
      <line x1="67" y1="38" x2="67" y2="53"/>
    </g>
    <path d="M 96 3 A 55 55 0 0 1 41 58 A 34 34 0 0 1 7 24 A 21 21 0 0 1 28 3 A 13 13 0 0 1 41 16 A 8 8 0 0 1 33 24 A 5 5 0 0 0 28 19"
          fill="none" stroke="#2C5970" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Subtle vertical rule between mark and wordmark -->
  <line x1="160" y1="20" x2="160" y2="80" stroke="#E0DACE" stroke-width="1"/>

  <!-- Wordmark: cosine with precision sine wave -->
  <g transform="translate(180, 0)">
    <text x="0" y="62" font-family="'Iowan Old Style', 'Palatino', 'Georgia', serif" font-size="38" fill="#1A1817">co</text>
    <path d="M 44 62 C 47.5 62, 47 55, 50.5 55 C 54 55, 53.5 62, 57 62 C 60.5 62, 60 69, 63.5 69 C 67 69, 66.5 62, 70 62"
          fill="none" stroke="#1A1817" stroke-width="1.6" stroke-linecap="round"/>
    <text x="76" y="62" font-family="'Iowan Old Style', 'Palatino', 'Georgia', serif" font-size="38" fill="#1A1817">sine</text>
  </g>
</svg>
